name: Windows Setup

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-setup.yml, app_version.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-setup
  cancel-in-progress: true # Publish the newest requested build for this branch.

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install Python build dependencies
        run: |
          $log = Join-Path $env:RUNNER_TEMP "pip-install.log"
          python -m pip install -r requirements.txt PyInstaller==6.16.0 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Python dependency installation failed. $((Get-Content $log -Tail 5) -join ' | ')"
            exit 1
          }
      - name: Locate or install NSIS
        run: |
          if ((Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -or
              (Test-Path "$env:ProgramFiles\NSIS\makensis.exe") -or
              (Get-Command makensis.exe -ErrorAction SilentlyContinue)) { exit 0 }
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -in @(0, 1641, 3010)) { exit 0 }
          winget install --id NSIS.NSIS --exact --version 3.11 --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the NSIS compiler." }
      - name: Freeze Windows executables
        run: |
          $version = python -c "from app_version import SOURCE_VERSION; print(SOURCE_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Join-Path $env:RUNNER_TEMP "workspace-build"
          $buildLog = Join-Path $env:RUNNER_TEMP "freeze.log"
          python scripts/build_windows.py --version $version --output $build 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $buildLog -Tail 12) -join " | "
            Write-Host "::error::Windows freeze failed. $tail"
            exit $LASTEXITCODE
          }
          "WORKSPACE_VERSION=$version" >> $env:GITHUB_ENV
          "WORKSPACE_PAYLOAD=$build\installer" >> $env:GITHUB_ENV
      - name: Compile Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "WorkSpace-Setup-$env:WORKSPACE_VERSION-x64.exe"
          $compiler = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { $compiler = (Get-Command makensis.exe -ErrorAction Stop).Source }
          $buildLog = Join-Path $env:RUNNER_TEMP "nsis.log"
          & $compiler /INPUTCHARSET UTF8 "/DVERSION=$env:WORKSPACE_VERSION" "/DPAYLOAD=$env:WORKSPACE_PAYLOAD" "/DSETUP_FILE=$setup" scripts/workspace_setup.nsi 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $setup)) {
            $tail = (Get-Content $buildLog -Tail 8) -join " | "
            Write-Host "::error::Setup build failed. $tail"
            exit 1
          }
          "WORKSPACE_SETUP=$setup" >> $env:GITHUB_ENV
          "WORKSPACE_NSIS=$compiler" >> $env:GITHUB_ENV
      - name: Install and verify the desktop application
        run: |
          $install = Join-Path $env:RUNNER_TEMP "workspace installed"
          $blocker = Start-Process -FilePath ping.exe -ArgumentList "-t", "127.0.0.1" -WindowStyle Hidden -PassThru
          try {
            $setup = Start-Process -FilePath $env:WORKSPACE_SETUP -ArgumentList "/S /WAITPID=$($blocker.Id) /D=$install" -PassThru
            Start-Sleep -Seconds 3
            if ($setup.HasExited -or (Test-Path "$install\current.json")) {
              throw "Setup did not wait for the previous process to exit."
            }
          } finally {
            if (!$blocker.HasExited) { Stop-Process -Id $blocker.Id -Force }
          }
          if (!$setup.WaitForExit(120000) -or $setup.ExitCode -ne 0) { throw "Setup did not finish successfully." }
          $folder = Join-Path $install "versions\$env:WORKSPACE_VERSION"
          if (!(Test-Path "$install\WorkSpace.exe") -or !(Test-Path "$install\Uninstall.exe")) {
            throw "Launcher or uninstaller missing."
          }
          $env:WORKSPACE_INSTALL_ROOT = $install
          $env:WORKSPACE_READY_FILE = Join-Path $env:RUNNER_TEMP "workspace-ready.txt"
          $marker = $env:WORKSPACE_READY_FILE
          $process = Start-Process -FilePath "$folder\WorkSpaceApp.exe" -WorkingDirectory $folder -PassThru
          try {
            for ($i = 0; $i -lt 90 -and !(Test-Path $marker) -and !$process.HasExited; $i++) {
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path $marker) -or (Get-Content $marker -Raw).Trim() -ne $env:WORKSPACE_VERSION -or $process.HasExited) {
              if (Test-Path "$install\logs\app.log") { Get-Content "$install\logs\app.log" }
              throw "Installed application did not report a ready menu."
            }
            $data = Join-Path $folder "_internal\data"
            python -c "import sys,sqlite3,pathlib; p=pathlib.Path(sys.argv[1]); db=sqlite3.connect((p/'ledgers'/'ledgers.sqlite3').as_uri()+'?mode=ro',uri=True); assert db.execute('SELECT count(*) FROM entries').fetchone()[0]>0; assert (p/'fund'/'statements.json').is_file(); assert (p/'govsubsidy'/'statements.json').is_file()" $data
            if ($LASTEXITCODE -ne 0) { throw "Installed runtime data verification failed." }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            Remove-Item Env:WORKSPACE_READY_FILE
          }
          try {
            python scripts/verify_setup_wizard.py $env:WORKSPACE_SETUP $install
            if ($LASTEXITCODE -ne 0) { throw "The update Setup wizard did not complete." }
            $started = $null
            for ($i = 0; $i -lt 45 -and !$started; $i++) {
              $started = Get-Process WorkSpaceApp -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq "$folder\WorkSpaceApp.exe" -and $_.MainWindowHandle -ne 0 }
              if (!$started) { Start-Sleep -Seconds 1 }
            }
            if (!$started) { throw "The installed launcher did not start WorkSpaceApp." }
          } finally {
            Get-Process WorkSpaceApp -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq "$folder\WorkSpaceApp.exe" } | Stop-Process -Force
          }
      - name: Build and verify the incremental installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseTag = gh release view --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or $baseTag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Previous release not found." }
          $base = $baseTag.Substring(1)
          $filename = "WorkSpace-Setup-$base-x64.exe"
          $previous = Join-Path $env:RUNNER_TEMP "previous-release"
          gh release download $baseTag --pattern $filename --pattern "$filename.sha256" --dir $previous
          if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the previous Setup." }
          $oldSetup = Join-Path $previous $filename
          $expected = ((Get-Content "$oldSetup.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash -ne $expected) { throw "Previous Setup checksum mismatch." }
          $installed = Join-Path $env:RUNNER_TEMP "patch test install"
          $proc = Start-Process $oldSetup -ArgumentList "/S /D=$installed" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Baseline installation failed." }
          $delta = Join-Path $env:RUNNER_TEMP "patch-files"
          python scripts/build_patch.py "$installed" "$env:WORKSPACE_PAYLOAD" "$delta"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = Join-Path $env:RUNNER_TEMP "WorkSpace-Patch-$base-to-$env:WORKSPACE_VERSION-x64.exe"
          & $env:WORKSPACE_NSIS /INPUTCHARSET UTF8 "/DVERSION=$env:WORKSPACE_VERSION" "/DPAYLOAD=$env:WORKSPACE_PAYLOAD" "/DPATCH_DIR=$delta" "/DSETUP_FILE=$patch" scripts/workspace_setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_setup_wizard.py "$patch" "$installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; import sys; from patch_files import file_manifest,file_hash; from release_update import current_state; a,b=map(Path,sys.argv[1:]); v=current_state(b)['current']; assert current_state(a)['current']==v and file_manifest(a/'versions'/v)==file_manifest(b/'versions'/v) and file_hash(a/'WorkSpace.exe')==file_hash(b/'WorkSpace.exe')" "$installed" "$env:WORKSPACE_PAYLOAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $patch).Length -lt (Get-Item $env:WORKSPACE_SETUP).Length) {
            "WORKSPACE_PATCH=$patch" >> $env:GITHUB_ENV
          }
      - name: Publish Setup and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @()
          foreach ($file in @($env:WORKSPACE_SETUP, $env:WORKSPACE_PATCH)) {
            if (!$file) { continue }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Set-Content -Encoding ascii "$file.sha256"
            $assets += $file, "$file.sha256"
          }
          gh release create "v$env:WORKSPACE_VERSION" @assets --target $env:GITHUB_SHA --title "Work Space $env:WORKSPACE_VERSION" --notes "Windows x64 Setup. Python 3.12 is bundled. The Patch installer updates the exact starting version in its filename. Use Setup for a fresh install or repair."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
